<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="585" viewBox="0 0 1122 585" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Live ISO layout">
  <title>Live ISO partition layout</title>
  <desc>An EFI system partition followed by a large exFAT area for ISO images and the service kit.</desc>
  <rect width="1122" height="585" fill="#1e1f22"/>
  <text x="48" y="64" fill="#c8c6c2" font-family="Segoe UI, sans-serif" font-size="28">Live ISOs</text>
  <text x="48" y="104" fill="#8a8780" font-family="Segoe UI, sans-serif" font-size="18">ESP + large exFAT (ISOs + service kit)</text>
  <rect x="48" y="220" width="140" height="96" rx="12" fill="#3d5a80"/>
  <text x="118" y="276" text-anchor="middle" fill="#eef2f7" font-family="Segoe UI, sans-serif" font-size="22">ESP</text>
  <rect x="204" y="220" width="870" height="96" rx="12" fill="#0b6e4f"/>
  <text x="639" y="276" text-anchor="middle" fill="#eef7f2" font-family="Segoe UI, sans-serif" font-size="22">exFAT drop zone + service kit</text>
  <text x="48" y="400" fill="#8a8780" font-family="Consolas, monospace" font-size="16">Windows Explorer sees the branded exFAT volume</text>
</svg>

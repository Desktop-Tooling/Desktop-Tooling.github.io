<!--
  Desktop Tooling mark - the glyph on a restrained steel app tile.
  Tile is flat brand steel with a thin slate rim; no gradient carries the
  recognition, so the mark survives flattening and 16 px favicon exports.
  Glyph geometry is identical to desktop-tooling-glyph.svg (scaled 1.75x).
-->

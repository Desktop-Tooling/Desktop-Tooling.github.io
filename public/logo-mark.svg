     viewBox="0 0 256 256"
     width="256" height="256"
     role="img"
     aria-label="Desktop Tooling">
  <title>Desktop Tooling</title>
  <desc>A two-pane desktop window with a hex-drive socket, on a steel app tile.</desc>
  <rect width="256" height="256" rx="56" fill="#101820"/>
  <rect x="1.25" y="1.25" width="253.5" height="253.5" rx="54.75" fill="none" stroke="#243140" stroke-width="2.5"/>
